include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - android/**
    - ios/**
  language:
    # JSON from the API is dynamic: force explicit casts so bad payloads fail
    # loudly at the mapping layer instead of deep inside the UI.
    strict-casts: true

linter:
  rules:
    - always_use_package_imports
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
    - use_build_context_synchronously
