name: futuremug_interviewer
description: "Futuremug Interviewer – evaluator companion app for Android and iOS (Flutter, Riverpod, Drift, Dio)."
publish_to: "none"
version: 1.0.0+1

environment:
  # The code uses APIs from Flutter 3.35 (e.g. DropdownButtonFormField
  # .initialValue). The team's exact version is pinned in .fvmrc.
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management & navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Networking & security
  dio: ^5.5.0+1
  flutter_secure_storage: ^9.2.2
  uuid: ^4.4.0

  # Local database (offline drafts & cache)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Formatting (dates, currency)
  intl: ^0.20.3

  # Files & links
  file_picker: ">=8.0.0 <11.0.0"
  image_picker: ^1.1.2
  open_filex: ^4.5.0
  url_launcher: ^6.3.0

  # Removed until the milestone that needs them (re-add then):
  # crypto (1D scorecard hash),
  # connectivity_plus (Phase 2 offline sync), flutter_localizations (Phase 2),
  # freezed / json_serializable / riverpod_generator / build_runner (only if
  # the team chooses code generation).

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
